[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasknet"
version = "0.1.0"
description = "Planar maximally filtered graph (PMFG) + Louvain community detection for bipartite association networks (e.g. job-task networks)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
keywords = ["PMFG", "planar maximally filtered graph", "community detection",
            "Louvain", "bipartite network", "job-task network", "O*NET"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "python-igraph>=0.11",
    "rustworkx>=0.14",
    "networkx>=3.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
metrics = ["scikit-learn>=1.3"]

[project.scripts]
tasknet = "tasknet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
