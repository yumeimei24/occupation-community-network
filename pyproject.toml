[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocnet"
version = "0.1.0"
description = "PMFG 过滤与 Louvain 社区发现,用于岗位—任务等二部关联网络"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anonymous" }]
keywords = ["PMFG", "planar maximally filtered graph", "community detection",
            "Louvain", "bipartite network", "occupation", "job-task network"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "python-igraph>=0.11",
    "rustworkx>=0.14",
    "networkx>=3.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
metrics = ["scikit-learn>=1.3"]

[project.scripts]
ocnet = "ocnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
